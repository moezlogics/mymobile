# ─────────────────────────────────────────────────────────────────────────
# mymobile.pk on the Next.js + Medusa stack (CloudPanel vhost)
#
#   mymobile.pk        → Next storefront     127.0.0.1:3124
#   api.mymobile.pk    → Medusa backend      127.0.0.1:3122
#   cdnlive.mymobile.pk    → image CDN           127.0.0.1:3123  (+ static /uploads)
#   /marketplace       → classifieds app     127.0.0.1:3800  (unchanged)
#
# Legacy media keeps answering 200 at the SAME URLs Google indexed:
#   /images/*      ← CDN uploads/images/      (copied 1:1 from PHP images/)
#   /cache/img/*   ← CDN uploads/cache/img/   (PHP resized thumbs, 1:1)
#
# Adjust CDN_UPLOADS below to the CDN's UPLOAD_DIR on the server.
# ─────────────────────────────────────────────────────────────────────────

# www → apex (same as the PHP vhost)
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.mymobile.pk;
  return 301 https://mymobile.pk$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name mymobile.pk;

  {{nginx_access_log}}
  {{nginx_error_log}}

  # Cloudflare real visitor IP (copied from the PHP vhost)
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  real_ip_header CF-Connecting-IP;

  set $mm_force_https 1;
  if ($scheme = "https") { set $mm_force_https 0; }
  if ($http_x_forwarded_proto = "https") { set $mm_force_https 0; }
  if ($http_cf_visitor ~* "https") { set $mm_force_https 0; }
  if ($mm_force_https) { return 301 https://$host$request_uri; }

  location ~ /.well-known { auth_basic off; allow all; }

  client_max_body_size 64m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  set $CDN_UPLOADS /home/mymobile-cdn/htdocs/cdnlive.mymobile.pk/uploads;

  # ── legacy media, served straight from disk (same URLs as PHP) ──────────
  location ^~ /images/ {
    alias $CDN_UPLOADS/images/;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
    try_files $uri =404;
  }
  location ^~ /cache/img/ {
    alias $CDN_UPLOADS/cache/img/;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Access-Control-Allow-Origin "*";
    access_log off;
    try_files $uri =404;
  }
  # Everything else under /cache/ and the PHP internals stays hidden.
  location ^~ /cache/ { return 404; }
  location ~ ^/(?:lib|includes|cron|tools|src|node_modules|uploads)/ { return 404; }
  location ~* \.(?:sql|md|bak|orig|swp|zip|tar|7z|rar|log|env)$ { return 404; }

  # ── classifieds (unchanged from PHP vhost) ──────────────────────────────
  location ~ ^/marketplace(?:/|$) {
    proxy_pass http://127.0.0.1:3800;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 200m;
  }

  # ── Next.js static assets (immutable, hashed) ───────────────────────────
  location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3124;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # ── everything else → Next storefront ───────────────────────────────────
  location / {
    proxy_pass http://127.0.0.1:3124;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_hide_header X-Powered-By;
    proxy_read_timeout 120s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }
}

# ── api.mymobile.pk → Medusa ─────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name api.mymobile.pk;
  client_max_body_size 64m;
  location / {
    proxy_pass http://127.0.0.1:3122;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}

# ── cdnlive.mymobile.pk → image CDN (uploads served from disk) ───────────────
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name cdnlive.mymobile.pk;
  client_max_body_size 32m;
  set $CDN_UPLOADS /home/mymobile-cdn/htdocs/cdnlive.mymobile.pk/uploads;
  location ^~ /uploads/ {
    alias $CDN_UPLOADS/;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    add_header X-Content-Type-Options "nosniff" always;
    access_log off;
    try_files $uri =404;
  }
  location / {
    proxy_pass http://127.0.0.1:3123;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
